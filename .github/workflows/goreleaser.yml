name: Build

# One job, one target: a static linux/amd64 binary. Nothing else — no tests,
# no other OS or architecture. Every push, pull request and tag builds and
# uploads the binary; a v* tag also attaches it to a GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer run for the same ref cancels the one in flight, so nothing queues.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build linux/amd64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/backhaul .
          tar -czf dist/backhaul_linux_amd64.tar.gz -C dist backhaul
          (cd dist && sha256sum backhaul_linux_amd64.tar.gz > backhaul_linux_amd64.tar.gz.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: backhaul_linux_amd64
          path: |
            dist/backhaul_linux_amd64.tar.gz
            dist/backhaul_linux_amd64.tar.gz.sha256
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/backhaul_linux_amd64.tar.gz
            dist/backhaul_linux_amd64.tar.gz.sha256
